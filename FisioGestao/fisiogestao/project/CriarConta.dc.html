<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar conta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7A6F}a:hover{color:#075A52}
.btn{transition:background .15s, box-shadow .15s, transform .05s}
.btn-primary:hover{background:#086A60 !important}
.btn-primary:active{transform:translateY(1px);background:#075A52 !important}
.btn-ghost:hover{background:#E6F4F2 !important}
.plan{cursor:pointer;transition:border-color .15s, box-shadow .15s}
.plan:hover{border-color:#7FC3BB !important}
.field:focus-within{border-color:#0B7A6F !important;box-shadow:0 0 0 3px rgba(11,122,111,.15)}
input{font:inherit;color:inherit;border:0;outline:0;background:transparent;width:100%}
</style>
</helmet>
<div style="width: 390px; min-height: 1040px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F2E2C; background: #F2F8F7; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 20px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="Voltar ao login" class="btn btn-ghost" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2E2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="font-size: 18px; font-weight: 700">Criar conta</div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #4F6462">
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #0B7A6F"></span>
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #0B7A6F"></span>
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #CFDFDC"></span>
    <span style="margin-left: 6px">Etapa 2 de 3</span>
  </div>

  <section style="display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 20px; font-weight: 800">Escolha seu plano</h2>
    <sc-for list="{{plans}}" as="p" hint-placeholder-count="2">
      <button type="button" class="plan" onClick="{{p.pick}}" aria-pressed="{{p.selected}}" style="{{p.cardStyle}}">
        <span style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
          <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="font-size: 16px; font-weight: 700; color: #0F2E2C">{{p.name}}</span>
            <span style="font-size: 13px; color: #4F6462">{{p.sub}}</span>
          </span>
          <span style="{{p.radioStyle}}"><span style="{{p.dotStyle}}"></span></span>
        </span>
        <span style="display: flex; align-items: baseline; gap: 4px; color: #0F2E2C">
          <span style="font-size: 24px; font-weight: 800">{{p.price}}</span>
          <span style="font-size: 14px; color: #4F6462">{{p.period}}</span>
        </span>
      </button>
    </sc-for>
    <ul style="margin: 0; padding: 14px 16px; list-style: none; background: #FFFFFF; border-radius: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: #2C4542">
      <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Pacientes ilimitados</li>
      <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Anamnese, evolução e sessões</li>
      <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Vídeos e fotos pelo celular</li>
      <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Exportação da ficha em PDF</li>
    </ul>
  </section>

  <section style="background: #FFFFFF; border-radius: 20px; padding: 20px; box-shadow: 0 1px 2px rgba(15,46,44,.06), 0 8px 24px rgba(15,46,44,.06); display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-size: 17px; font-weight: 700">Seus dados profissionais</h2>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Nome completo
      <span class="field" style="display: flex; align-items: center; height: 50px; padding: 0 14px; border: 1.5px solid #CFDFDC; border-radius: 12px; font-size: 16px; font-weight: 400"><input type="text" placeholder="Como aparece no seu registro"></span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">CREFITO
      <span class="field" style="display: flex; align-items: center; height: 50px; padding: 0 14px; border: 1.5px solid #CFDFDC; border-radius: 12px; font-size: 16px; font-weight: 400"><input type="text" placeholder="Ex.: 123456-F"></span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">E-mail
      <span class="field" style="display: flex; align-items: center; height: 50px; padding: 0 14px; border: 1.5px solid #CFDFDC; border-radius: 12px; font-size: 16px; font-weight: 400"><input type="email" placeholder="seu@email.com.br"></span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Criar senha
      <span class="field" style="display: flex; align-items: center; height: 50px; padding: 0 14px; border: 1.5px solid #CFDFDC; border-radius: 12px; font-size: 16px; font-weight: 400"><input type="password" placeholder="Mínimo de 8 caracteres"></span>
      <span style="display: flex; gap: 4px; margin-top: 2px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #CFDFDC"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #CFDFDC"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #CFDFDC"></span></span>
    </label>
    <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #4F6462; line-height: 1.45">
      <input type="checkbox" style="width: 20px; height: 20px; flex: none; margin: 0; accent-color: #0B7A6F">
      <span>Li e aceito os <a href="#">Termos de uso</a> e a <a href="#">Política de privacidade (LGPD)</a>.</span>
    </label>
  </section>

  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: auto">
    <a href="Dashboard.dc.html" class="btn btn-primary" style="height: 54px; border-radius: 14px; background: #0B7A6F; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 12px rgba(11,122,111,.25)">Continuar para pagamento</a>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #4F6462">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      Pagamento seguro · Cancele quando quiser
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { plan: 'mensal' }; }
  renderVals() {
    const list = [
      { id: 'mensal', name: 'Mensal', sub: 'Pague mês a mês', price: 'R$ [VALOR]', period: '/mês' },
      { id: 'anual', name: 'Anual', sub: '12 meses com desconto', price: 'R$ [VALOR]', period: '/ano' }
    ];
    return {
      plans: list.map((p) => {
        const on = this.state.plan === p.id;
        return {
          ...p,
          selected: on ? 'true' : 'false',
          pick: () => this.setState({ plan: p.id }),
          cardStyle: 'width: 100%; font: inherit; text-align: left; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: ' + (on ? '#F0FAF8' : '#FFFFFF') + '; border: 2px solid ' + (on ? '#0B7A6F' : '#DDE9E7') + '; box-shadow: ' + (on ? '0 4px 14px rgba(11,122,111,.15)' : '0 1px 2px rgba(15,46,44,.05)'),
          radioStyle: 'width: 22px; height: 22px; flex: none; border-radius: 50%; box-sizing: border-box; border: 2px solid ' + (on ? '#0B7A6F' : '#9FB3B0') + '; display: flex; align-items: center; justify-content: center',
          dotStyle: 'width: 10px; height: 10px; border-radius: 50%; background: ' + (on ? '#0B7A6F' : 'transparent')
        };
      })
    };
  }
}
</script>
</body>
</html>
