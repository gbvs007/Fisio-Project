<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Consultar paciente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7A6F}a:hover{color:#075A52}
.tap{transition:background .15s}
.tap:hover{background:#E6F4F2 !important}
.row{transition:box-shadow .15s}
.row:hover{box-shadow:0 6px 18px rgba(15,46,44,.10) !important}
.chip{cursor:pointer;transition:background .15s}
.search:focus-within{border-color:#0B7A6F !important;box-shadow:0 0 0 3px rgba(11,122,111,.15)}
.fab:hover{background:#086A60 !important}
input{font:inherit;color:inherit;border:0;outline:0;background:transparent;width:100%}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F2E2C; background: #F2F8F7; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 4px 8px">
    <a href="Dashboard.dc.html" aria-label="Voltar" class="tap" style="width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2E2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 800">Pacientes</h1>
    <span style="margin-left: auto; font-size: 14px; color: #4F6462; padding-right: 8px">48 cadastrados</span>
  </header>

  <div style="padding: 8px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <label class="search" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 1.5px solid #CFDFDC; border-radius: 14px; background: #FFFFFF; font-size: 16px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F6462" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" aria-label="Buscar por nome ou CPF" placeholder="Buscar por nome ou CPF" value="{{query}}" onChange="{{onQuery}}">
    </label>
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button type="button" class="chip" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow: auto; padding: 0 20px 96px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="p" hint-placeholder-count="6">
      <a href="FichaPaciente.dc.html" class="row" style="display: flex; align-items: center; gap: 12px; padding: 14px; background: #FFFFFF; border-radius: 16px; text-decoration: none; color: #0F2E2C; box-shadow: 0 1px 3px rgba(15,46,44,.06)">
        <span style="width: 46px; height: 46px; flex: none; border-radius: 50%; background: #E3EEF9; color: #1B5B8F; display: flex; align-items: center; justify-content: center; font-weight: 700">{{p.ini}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
          <span style="font-size: 13px; color: #4F6462">CPF {{p.cpf}}</span>
          <span style="display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap">
            <span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #E3F3F0; color: #0B5F56">{{p.tipo}}</span>
            <span style="font-size: 12px; color: #4F6462; padding: 3px 0">Última sessão: {{p.last}}</span>
          </span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A8F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="text-align: center; padding: 40px 16px; color: #4F6462; font-size: 15px">Nenhum paciente encontrado.<br><a href="CadastroPaciente.dc.html" style="font-weight: 700">Cadastrar novo paciente</a></div>
    </sc-if>
  </div>

  <a href="CadastroPaciente.dc.html" class="fab" style="position: absolute; right: 20px; bottom: 24px; height: 56px; padding: 0 20px 0 16px; border-radius: 18px; background: #0B7A6F; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; box-shadow: 0 8px 20px rgba(11,122,111,.35)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    Novo paciente
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { q: '', f: 'Todos' }; }
  renderVals() {
    const all = [
      { ini: 'MO', name: 'Marcos Oliveira Santos', cpf: '•••.482.317-••', tipo: 'Ortopédica', last: 'hoje' },
      { ini: 'HR', name: 'Helena Ribeiro Costa', cpf: '•••.901.226-••', tipo: 'Ortopédica', last: '25/10' },
      { ini: 'CS', name: 'Cláudia Souza Melo', cpf: '•••.330.874-••', tipo: 'Neurológica', last: '27/10' },
      { ini: 'RT', name: 'Rafael Torres Lima', cpf: '•••.115.602-••', tipo: 'Esportiva', last: '26/10' },
      { ini: 'BN', name: 'Beatriz Nunes Ferreira', cpf: '•••.748.519-••', tipo: 'Ortopédica', last: '24/10' },
      { ini: 'JA', name: 'João Pedro Almeida', cpf: '•••.263.087-••', tipo: 'Respiratória', last: '—' },
      { ini: 'LM', name: 'Lúcia Martins Rocha', cpf: '•••.659.140-••', tipo: 'Geriátrica', last: '22/10' }
    ];
    const q = this.state.q.trim().toLowerCase();
    const rows = all.filter((p) => (this.state.f === 'Todos' || p.tipo === this.state.f) && (!q || p.name.toLowerCase().includes(q) || p.cpf.includes(q)));
    const chips = ['Todos', 'Ortopédica', 'Neurológica', 'Esportiva', 'Respiratória'].map((label) => {
      const on = this.state.f === label;
      return {
        label, pressed: on ? 'true' : 'false',
        pick: () => this.setState({ f: label }),
        style: 'flex: none; height: 40px; padding: 0 16px; border-radius: 20px; font: inherit; font-size: 14px; font-weight: 600; border: 1.5px solid ' + (on ? '#0B7A6F' : '#CFDFDC') + '; background: ' + (on ? '#0B7A6F' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#2C4542')
      };
    });
    return { query: this.state.q, onQuery: (e) => this.setState({ q: e.target.value }), chips, rows, empty: rows.length === 0 };
  }
}
</script>
</body>
</html>
