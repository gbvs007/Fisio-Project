<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FisioGestão — Design do App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#E4EEEC;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0F2E2C}
  .bar{position:sticky;top:0;z-index:10;background:#FFFFFF;border-bottom:1px solid #CFDFDC;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bar strong{margin-right:8px;font-size:16px}
  .bar a{font-size:13px;font-weight:600;text-decoration:none;color:#2C4542;padding:8px 12px;border-radius:10px;background:#F2F8F7}
  .bar a[aria-current="page"]{background:#0B7A6F;color:#FFFFFF}
  .bar a.all{margin-left:auto;border:1.5px solid #0B7A6F;background:#FFFFFF;color:#0B7A6F}
  .stage{padding:32px 16px;display:flex;flex-wrap:wrap;gap:48px 40px;justify-content:center;align-items:flex-start}
  .frame{display:flex;flex-direction:column;gap:10px;max-width:100%}
  .frame h2{margin:0;font-size:14px;font-weight:600;color:#4F6462}
  .host{background:#FFFFFF;overflow:auto;box-shadow:0 10px 30px rgba(15,46,44,.15);max-width:100%}
  .frame.fluid{width:100%}
</style>
</head>
<body>
<nav class="bar" id="bar"></nav>
<main class="stage" id="stage"></main>
<template id="tpl-Main"><style>
body{margin:0}
a{color:#0B7A6F}a:hover{color:#075A52}
.btn{transition:background .15s, box-shadow .15s, transform .05s}
.btn-primary:hover{background:#086A60 !important}
.btn-primary:active{transform:translateY(1px);background:#075A52 !important}
.btn-ghost:hover{background:#E6F4F2 !important}
.field:focus-within{border-color:#0B7A6F !important;box-shadow:0 0 0 3px rgba(11,122,111,.15)}
input{font:inherit;color:inherit;border:0;outline:0;background:transparent;width:100%}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F2E2C; background: #F2F8F7; display: flex; flex-direction: column; padding: 56px 24px 28px; gap: 28px">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 20px">
    <div style="width: 72px; height: 72px; border-radius: 22px; background: #0B7A6F; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(11,122,111,.25)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2"></circle><path d="M12 7v6l-3 7"></path><path d="M12 13l3 7"></path><path d="M7 10h10"></path></svg>
    </div>
    <div style="text-align: center">
      <div style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">FisioGestão</div>
      <div style="font-size: 14px; color: #4F6462; margin-top: 4px">Prontuário simples para fisioterapeutas</div>
    </div>
  </div>

  <form style="background: #FFFFFF; border-radius: 20px; padding: 24px 20px; box-shadow: 0 1px 2px rgba(15,46,44,.06), 0 8px 24px rgba(15,46,44,.06); display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      Entrar com segurança
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
      E-mail
      <span class="field" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 1.5px solid #CFDFDC; border-radius: 12px; background: #FFFFFF; font-size: 16px; font-weight: 400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F6462" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
        <input type="email" placeholder="seu@email.com.br" value="ana.fisio@email.com.br">
      </span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
      Senha
      <span class="field" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 6px 0 14px; border: 1.5px solid #CFDFDC; border-radius: 12px; background: #FFFFFF; font-size: 16px; font-weight: 400">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F6462" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <input type="password" placeholder="Sua senha" value="senhasegura">
        <button type="button" aria-label="Mostrar senha" class="btn btn-ghost" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F6462" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </span>
    </label>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px">
      <label style="display: flex; align-items: center; gap: 8px; color: #4F6462; min-height: 44px">
        <input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: #0B7A6F">
        Manter conectado
      </label>
      <a href="#" style="font-weight: 600; text-decoration: none">Esqueci a senha</a>
    </div>
    <a href="Dashboard.dc.html" class="btn btn-primary" style="height: 54px; border-radius: 14px; background: #0B7A6F; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-shadow: 0 4px 12px rgba(11,122,111,.25)">
      Entrar
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </a>
  </form>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 15px; color: #4F6462">
    Ainda não tem conta?
    <a href="CriarConta.dc.html" class="btn btn-ghost" style="height: 48px; width: 100%; box-sizing: border-box; border: 1.5px solid #0B7A6F; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none; background: transparent">Criar conta e assinar</a>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 14px; background: #E3F3F0; border-radius: 12px; font-size: 13px; color: #0F4A44">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"></path><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>
    <span><strong>Dados protegidos</strong> · Criptografia e conformidade com a LGPD</span>
  </div>
</div>
</template>
<template id="tpl-CriarConta"><style>
body{margin:0}
a{color:#0B7A6F}a:hover{color:#075A52}
.btn{transition:background .15s, box-shadow .15s, transform .05s}
.btn-primary:hover{background:#086A60 !important}
.btn-primary:active{transform:translateY(1px);background:#075A52 !important}
.btn-ghost:hover{background:#E6F4F2 !important}
.plan{cursor:pointer;transition:border-color .15s, box-shadow .15s}
.plan:hover{border-color:#7FC3BB !important}
.field:focus-within{border-color:#0B7A6F !important;box-shadow:0 0 0 3px rgba(11,122,111,.15)}
input{font:inherit;color:inherit;border:0;outline:0;background:transparent;width:100%}
</style>

<div style="width: 390px; min-height: 1040px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F2E2C; background: #F2F8F7; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 20px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="Voltar ao login" class="btn btn-ghost" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F2E2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="font-size: 18px; font-weight: 700">Criar conta</div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #4F6462">
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #0B7A6F"></span>
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #0B7A6F"></span>
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #CFDFDC"></span>
    <span style="margin-left: 6px">Etapa 2 de 3</span>
  </div>

  <section style="display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 20px; font-weight: 800">Escolha seu plano</h2>
    <sc-for list="{{plans}}" as="p" hint-placeholder-count="2">
      <button type="button" class="plan" onClick="{{p.pick}}" aria-pressed="{{p.selected}}" style="{{p.cardStyle}}">
        <span style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
          <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="font-size: 16px; font-weight: 700; color: #0F2E2C">{{p.name}}</span>
            <span style="font-size: 13px; color: #4F6462">{{p.sub}}</span>
          </span>
          <span style="{{p.radioStyle}}"><span style="{{p.dotStyle}}"></span></span>
        </span>
        <span style="display: flex; align-items: baseline; gap: 4px; color: #0F2E2C">
          <span style="font-size: 24px; font-weight: 800">{{p.price}}</span>
          <span style="font-size: 14px; color: #4F6462">{{p.period}}</span>
        </span>
      </button>
    </sc-for>
    <ul style="margin: 0; padding: 14px 16px; list-style: none; background: #FFFFFF; border-radius: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: #2C4542">
      <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Pacientes ilimitados</li>
      <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Anamnese, evolução e sessões</li>
      <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Vídeos e fotos pelo celular</li>
      <li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Exportação da ficha em PDF</li>
    </ul>
  </section>

  <section style="background: #FFFFFF; border-radius: 20px; padding: 20px; box-shadow: 0 1px 2px rgba(15,46,44,.06), 0 8px 24px rgba(15,46,44,.06); display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-size: 17px; font-weight: 700">Seus dados profissionais</h2>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Nome completo
      <span class="field" style="display: flex; align-items: center; height: 50px; padding: 0 14px; border: 1.5px solid #CFDFDC; border-radius: 12px; font-size: 16px; font-weight: 400"><input type="text" placeholder="Como aparece no seu registro"></span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">CREFITO
      <span class="field" style="display: flex; align-items: center; height: 50px; padding: 0 14px; border: 1.5px solid #CFDFDC; border-radius: 12px; font-size: 16px; font-weight: 400"><input type="text" placeholder="Ex.: 123456-F"></span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">E-mail
      <span class="field" style="display: flex; align-items: center; height: 50px; padding: 0 14px; border: 1.5px solid #CFDFDC; border-radius: 12px; font-size: 16px; font-weight: 400"><input type="email" placeholder="seu@email.com.br"></span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Criar senha
      <span class="field" style="display: flex; align-items: center; height: 50px; padding: 0 14px; border: 1.5px solid #CFDFDC; border-radius: 12px; font-size: 16px; font-weight: 400"><input type="password" placeholder="Mínimo de 8 caracteres"></span>
      <span style="display: flex; gap: 4px; margin-top: 2px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #CFDFDC"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #CFDFDC"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #CFDFDC"></span></span>
    </label>
    <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #4F6462; line-height: 1.45">
      <input type="checkbox" style="width: 20px; height: 20px; flex: none; margin: 0; accent-color: #0B7A6F">
      <span>Li e aceito os <a href="#">Termos de uso</a> e a <a href="#">Política de privacidade (LGPD)</a>.</span>
    </label>
  </section>

  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: auto">
    <a href="Dashboard.dc.html" class="btn btn-primary" style="height: 54px; border-radius: 14px; background: #0B7A6F; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 12px rgba(11,122,111,.25)">Continuar para pagamento</a>
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #4F6462">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      Pagamento seguro · Cancele quando quiser
    </div>
  </div>
</div>
</template>
<template id="tpl-Dashboard"><style>
body{margin:0}
a{color:#0B7A6F}a:hover{color:#075A52}
.tap{transition:background .15s, box-shadow .15s, transform .08s}
.tap:hover{background:#E6F4F2 !important}
.card-main{transition:box-shadow .15s, transform .08s}
.card-main:hover{box-shadow:0 10px 28px rgba(15,46,44,.14) !important}
.card-main:active{transform:scale(.98)}
.row:hover{background:#F6FBFA !important}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F2E2C; background: #F2F8F7; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px 8px; background: #F2F8F7">
    <a href="MenuAberto.dc.html" aria-label="Abrir menu" class="tap" style="width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F2E2C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
    </a>
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px">
      <span style="width: 30px; height: 30px; border-radius: 9px; background: #0B7A6F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2"></circle><path d="M12 7v6l-3 7"></path><path d="M12 13l3 7"></path><path d="M7 10h10"></path></svg></span>
      FisioGestão
    </div>
    <a href="#" aria-label="Minha conta" style="width: 40px; height: 40px; border-radius: 50%; background: #D6ECF8; color: #1B5B8F; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; text-decoration: none">AL</a>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 8px 20px 20px; overflow: hidden">
    <div>
      <div style="font-size: 14px; color: #4F6462">Terça-feira, 28 de outubro</div>
      <h1 style="margin: 2px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">Olá, Dra. Ana</h1>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="Pacientes.dc.html" class="card-main" style="min-height: 148px; box-sizing: border-box; padding: 18px 16px; border-radius: 20px; background: #0B7A6F; color: #FFFFFF; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 6px 18px rgba(11,122,111,.28)">
        <span style="width: 48px; height: 48px; border-radius: 14px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        </span>
        <span style="font-size: 17px; font-weight: 700; line-height: 1.25">Consultar<br>Paciente</span>
      </a>
      <a href="CadastroPaciente.dc.html" class="card-main" style="min-height: 148px; box-sizing: border-box; padding: 18px 16px; border-radius: 20px; background: #FFFFFF; color: #0F2E2C; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; border: 1.5px solid #CDE6E2; box-shadow: 0 2px 8px rgba(15,46,44,.06)">
        <span style="width: 48px; height: 48px; border-radius: 14px; background: #E3F3F0; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B7A6F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"></path><path d="M19 8v6"></path><path d="M16 11h6"></path></svg>
        </span>
        <span style="font-size: 17px; font-weight: 700; line-height: 1.25">Cadastrar<br>Paciente</span>
      </a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 14px 12px; box-shadow: 0 1px 3px rgba(15,46,44,.06)">
        <div style="font-size: 24px; font-weight: 800">48</div>
        <div style="font-size: 12px; color: #4F6462; font-weight: 500">Pacientes ativos</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 14px 12px; box-shadow: 0 1px 3px rgba(15,46,44,.06)">
        <div style="font-size: 24px; font-weight: 800">5</div>
        <div style="font-size: 12px; color: #4F6462; font-weight: 500">Sessões hoje</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 14px 12px; box-shadow: 0 1px 3px rgba(15,46,44,.06)">
        <div style="font-size: 24px; font-weight: 800">23</div>
        <div style="font-size: 12px; color: #4F6462; font-weight: 500">Sessões na semana</div>
      </div>
    </div>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 16px 8px 8px; box-shadow: 0 1px 3px rgba(15,46,44,.06); display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px 8px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Próximas sessões</h2>
        <a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px 4px">Ver todas</a>
      </div>
      <sc-for list="{{sessions}}" as="s" hint-placeholder-count="3">
        <a href="FichaPaciente.dc.html" class="row" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; text-decoration: none; color: #0F2E2C">

// Mini-runtime para o formato .dc.html: {{caminho}}, <sc-for>, <sc-if>, on* e estado.
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { Object.assign(this.state, patch); this._render && this._render(); }
  renderVals() { return {}; }
}
const HOLE = /\{\{\s*([\w.$]+)\s*\}\}/g;
const ONLY = /^\{\{\s*([\w.$]+)\s*\}\}$/;
const get = (scope, path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
const fill = (str, scope) => str.replace(HOLE, (_, p) => { const v = get(scope, p); return v == null ? '' : String(v); });
const value = (str, scope) => { const m = str.trim().match(ONLY); return m ? get(scope, m[1]) : str; };
const truthy = (v) => v === true || (v !== false && v !== 'false' && v != null && v !== '' && v !== 0);
const BOOL = ['disabled', 'checked', 'selected', 'hidden', 'readonly'];

function proc(node, scope, go) {
  for (const child of [...node.childNodes]) {
    if (child.nodeType === 3) { if (child.data.includes('{{')) child.data = fill(child.data, scope); continue; }
    if (child.nodeType !== 1) continue;
    const tag = child.localName;
    if (tag === 'sc-for') {
      const list = value(child.getAttribute('list') || '', scope) || [];
      const as = child.getAttribute('as') || 'item';
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        const tmp = document.createElement('div');
        for (const c of child.childNodes) tmp.appendChild(c.cloneNode(true));
        proc(tmp, { ...scope, [as]: item, $index: i }, go);
        frag.append(...tmp.childNodes);
      });
      child.replaceWith(frag);
      continue;
    }
    if (tag === 'sc-if') {
      if (truthy(value(child.getAttribute('value') || '', scope))) { proc(child, scope, go); child.replaceWith(...child.childNodes); }
      else child.remove();
      continue;
    }
    for (const attr of [...child.attributes]) {
      const n = attr.name;
      if (n.startsWith('on')) {
        const fn = value(attr.value, scope);
        child.removeAttribute(n);
        if (typeof fn === 'function') {
          const ev = n.slice(2) === 'change' && child.localName === 'input' ? 'input' : n.slice(2);
          child.addEventListener(ev, fn);
        }
      } else if (BOOL.includes(n) && ONLY.test(attr.value.trim())) {
        if (truthy(value(attr.value, scope))) child.setAttribute(n, ''); else child.removeAttribute(n);
      } else if (attr.value.includes('{{')) {
        child.setAttribute(n, fill(attr.value, scope));
      }
    }
    if (child.localName === 'a') {
      const href = child.getAttribute('href') || '';
      const m = href.match(/^([\w-]+)\.dc\.html$/);
      if (m) child.addEventListener('click', (e) => { e.preventDefault(); go(m[1]); });
      else if (href === '#') child.addEventListener('click', (e) => e.preventDefault());
    }
    proc(child, scope, go);
  }
}

function mount(screen, host, go) {
  const root = host.attachShadow({ mode: 'open' });
  const tpl = document.getElementById('tpl-' + screen.id);
  const Component = new Function('DCLogic', screen.code + '\nreturn Component;')(DCLogic);
  const comp = new Component({ ...screen.props });
  comp._render = () => {
    // preserva foco e cursor ao re-renderizar (ex.: busca de pacientes)
    const inputs = [...root.querySelectorAll('input,textarea')];
    const idx = inputs.indexOf(root.activeElement);
    const sel = idx >= 0 ? root.activeElement.selectionStart : null;
    const frag = tpl.content.cloneNode(true);
    const wrap = document.createElement('div');
    wrap.append(frag);
    proc(wrap, comp.renderVals(), go);
    root.replaceChildren(...wrap.childNodes);
    if (idx >= 0) {
      const el = root.querySelectorAll('input,textarea')[idx];
      if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (_) {} }
    }
  };
  comp._render();
}

const bar = document.getElementById('bar');
const stage = document.getElementById('stage');

function show(id) {
  const list = id ? SCREENS.filter((s) => s.id === id) : SCREENS;
  stage.replaceChildren();
  for (const s of list) {
    const frame = document.createElement('section');
    frame.className = 'frame' + (s.fluid ? ' fluid' : '');
    const h = document.createElement('h2');
    h.textContent = s.title;
    const host = document.createElement('div');
    host.className = 'host';
    host.style.width = s.fluid ? '100%' : s.w + 'px';
    host.style.minHeight = s.h + 'px';
    if (!s.fluid) host.style.height = s.h + 'px';
    host.style.borderRadius = s.radius + 'px';
    frame.append(h, host);
    stage.append(frame);
    mount(s, host, (target) => { location.hash = target; });
  }
  for (const a of bar.querySelectorAll('a')) {
    if (a.dataset.id === (id || '')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  window.scrollTo(0, 0);
}

bar.innerHTML = '<strong>FisioGestão</strong>';
for (const s of SCREENS) {
  const a = document.createElement('a');
  a.href = '#' + s.id; a.dataset.id = s.id; a.textContent = s.title;
  bar.append(a);
}
const all = document.createElement('a');
all.href = '#'; all.dataset.id = ''; all.className = 'all'; all.textContent = 'Ver todas as telas';
bar.append(all);

const route = () => { const id = location.hash.slice(1); show(SCREENS.some((s) => s.id === id) ? id : ''); };
window.addEventListener('hashchange', route);
route();
</script>
